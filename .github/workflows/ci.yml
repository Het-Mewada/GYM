name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main, 'phase-*']

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: gym_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint & Security Checks
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Initialize Database Roles and Apply DDL v5
        run: |
          PGPASSWORD=postgres_ci_password psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d gym_saas_test -f docker/initdb/01-init-roles.sql
          PGPASSWORD=postgres_ci_password psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d gym_saas_test -f scripts/ddl_v5.sql

      - name: Run Test Suites (HTTP Cross-Tenant, Auth, Concurrency, Catalog, Drift)
        run: pnpm exec turbo run test --force
        env:
          DATABASE_URL: postgres://app_user:dev_app_password_only@localhost:5432/gym_saas_test
          ADMIN_DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/gym_saas_test
          JWT_SECRET: dev_jwt_secret_must_be_strong_and_32_characters_minimum
          COOKIE_SECRET: dev_cookie_secret_at_least_32_characters_long

      - name: Build applications
        run: pnpm run build
